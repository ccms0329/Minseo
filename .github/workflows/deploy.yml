# 사이트를 빌드해 GitHub Pages(https://ccms0329.github.io/Minseo/)에 올린다.
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 로 설정되어 있어야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ecstatic-rubin-kll115, main]
    paths-ignore: ['.github/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 빌드와 배포를 별도 작업으로 나눈다. 같은 작업 안에서 업로드 직후 바로 배포하면
  # GitHub가 업로드를 아직 인식하지 못해 "No artifacts named github-pages" 로 실패하는 경우가 있다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
