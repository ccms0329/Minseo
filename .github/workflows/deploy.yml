# 사이트를 빌드해 GitHub Pages(https://ccms0329.github.io/Minseo/)에 올린다.
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 로 설정되어 있어야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ecstatic-rubin-kll115, main]
    paths-ignore: ['.github/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
